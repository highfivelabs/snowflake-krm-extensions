apiVersion: v1
kind: Secret
metadata:
  name: snowflake-credentials
  namespace: team-a
stringData:
  token: <token>
---
apiVersion: core.snowflake.hfl.dev/v1alpha1
kind: Connection
metadata:
  name: default
  namespace: team-a
spec:
  baseURL: https://myorg-myaccount.snowflakecomputing.com
  secretRef:
    name: snowflake-credentials
