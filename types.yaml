          template: "{qualified_expression_name} AS {sql_expression}[ WITH SYNONYMS ({synonym})][ COMMENT = {comment}]"
          fields:
            comment:
              type: string
            qualified_expression_name:
              type: name
            sql_expression:
              type: expression
            synonym:
              type: strings
      facts:
        type: objects
        item:
          template: "[PRIVATE{?is_private} ]{qualified_expression_name} AS {sql_expression}[ WITH SYNONYMS ({synonym})][ COMMENT = {comment}]"
          fields:
            comment:
              type: string
            is_private:
              type: boolean
            qualified_expression_name:
              type: name
            sql_expression:
              type: expression
            synonym:
              type: strings
      metrics:
        type: objects
        item:
          template: "[PRIVATE{?is_private} ][{semantic_expression}][{window_function}]"
          fields:
            is_private:
              type: boolean
            semantic_expression:
              type: object
              item:
                template: "{qualified_expression_name} AS {sql_expression}[ WITH SYNONYMS ({synonym})][ COMMENT = {comment}]"
                fields:
                  comment:
                    type: string
                  qualified_expression_name:
                    type: name
                  sql_expression:
                    type: expression
                  synonym:
                    type: strings
            window_function:
              type: object
              item:
                template: "{qualified_expression_name} AS {sql_expression} OVER ({over_clause})"
                fields:
                  over_clause:
                    type: object
                    item:
                      template: "[PARTITION BY {partition_by}][ ORDER BY {order_by}][ {window_frame_clause}]"
                      fields:
                        order_by:
                          type: expression
                        partition_by:
                          type: expression
                        window_frame_clause:
                          type: expression
                  qualified_expression_name:
                    type: name
                  sql_expression:
                    type: expression
      name:
        type: identifier
      relationships:
        type: objects
        item:
          template: "[{relationship_identifier} AS ]{table_name_or_alias} ({relationship_columns}) REFERENCES {referenced_table_name_or_alias}[ ({referenced_relationship_columns})]"
          fields:
            referenced_relationship_columns:
              type: identifiers
            referenced_table_name_or_alias:
              type: object
              item:
                template: "[{table_name}][{table_alias}]"
                fields:
                  table_alias:
                    type: identifier
                  table_name:
                    type: name
            relationship_columns:
              type: identifiers
            relationship_identifier:
              type: identifier
            table_name_or_alias:
              type: object
              item:
                template: "[{table_name}][{table_alias}]"
                fields:
                  table_alias:
                    type: identifier
                  table_name:
                    type: name
      schema:
        type: identifier
      tables:
        type: objects
        item:
          template: "{table_alias} AS {table_name}[ PRIMARY KEY ({primary_key})][ {unique}][ WITH SYNONYMS ({synonym})][ COMMENT = {comment}]"
          fields:
            comment:
              type: string
            primary_key:
              type: identifiers
            synonym:
              type: strings
            table_alias:
              type: identifier
            table_name:
              type: name
            unique:
              type: objects
              item:
                template: UNIQUE ({values})
                fields:
                  values:
                    type: identifiers
                sep: ' '
    create: CREATE SEMANTIC VIEW {@id} TABLES ({tables})[ RELATIONSHIPS ({relationships})][ FACTS ({facts})][ DIMENSIONS ({dimensions})][ METRICS ({metrics})][ COMMENT = {comment}]
    delete: DROP SEMANTIC VIEW IF EXISTS {@id}
    read:
    - statement: SHOW SEMANTIC VIEWS LIKE {@like} IN SCHEMA {@parent}
      match:
        name: "{name}"
        database_name: "{database}"
        schema_name: "{schema}"
      columns:
        comment: comment
    alter:
      comment: ALTER SEMANTIC VIEW {@id} SET COMMENT = {comment}
    unset:
      comment: ALTER SEMANTIC VIEW {@id} UNSET COMMENT
