- kind: ExternalAccessIntegration
  group: external.snowflake.hfl.dev
  version: v1alpha1
  plural: externalaccessintegrations
  shape: sql
  read:
    method: POST
    path: /api/v2/statements
  terraform:
  - snowflake_external_access_integration
  sample:
    name: example_access
    allowed_network_rules:
    - example_db.example_schema.example_rule
    enabled: true
    comment: example-comment
  readiness: fake
  sql:
    mode: object
    id: *id002
    fields:
      allowed_api_authentication_integrations:
        type: identifiers
      allowed_authentication_secrets:
        type: names
      allowed_network_rules:
        type: names
      comment:
        type: string
      enabled:
        type: boolean
      name:
        type: identifier
    create: CREATE EXTERNAL ACCESS INTEGRATION {@id} ALLOWED_NETWORK_RULES = ({allowed_network_rules})[ ALLOWED_API_AUTHENTICATION_INTEGRATIONS = ({allowed_api_authentication_integrations})][ ALLOWED_AUTHENTICATION_SECRETS = ({allowed_authentication_secrets})] ENABLED = {enabled}[ COMMENT = {comment}]
    delete: DROP EXTERNAL ACCESS INTEGRATION IF EXISTS {@id}
    read:
    - statement: SHOW EXTERNAL ACCESS INTEGRATIONS LIKE {@like}
      match:
        name: "{name}"
      columns:
        comment: comment
        enabled: enabled
    - statement: DESCRIBE EXTERNAL ACCESS INTEGRATION {@id}
      properties:
        name: property
        value: property_value
      columns:
        allowed_network_rules: ALLOWED_NETWORK_RULES
        allowed_api_authentication_integrations: ALLOWED_API_AUTHENTICATION_INTEGRATIONS
        allowed_authentication_secrets: ALLOWED_AUTHENTICATION_SECRETS
    alter:
      allowed_network_rules: ALTER EXTERNAL ACCESS INTEGRATION {@id} SET ALLOWED_NETWORK_RULES = ({allowed_network_rules})
      allowed_api_authentication_integrations: ALTER EXTERNAL ACCESS INTEGRATION {@id} SET ALLOWED_API_AUTHENTICATION_INTEGRATIONS = ({allowed_api_authentication_integrations})
      allowed_authentication_secrets: ALTER EXTERNAL ACCESS INTEGRATION {@id} SET ALLOWED_AUTHENTICATION_SECRETS = ({allowed_authentication_secrets})
      enabled: ALTER EXTERNAL ACCESS INTEGRATION {@id} SET ENABLED = {enabled}
      comment: ALTER EXTERNAL ACCESS INTEGRATION {@id} SET COMMENT = {comment}
    unset:
      allowed_api_authentication_integrations: ALTER EXTERNAL ACCESS INTEGRATION {@id} UNSET ALLOWED_API_AUTHENTICATION_INTEGRATIONS
      allowed_authentication_secrets: ALTER EXTERNAL ACCESS INTEGRATION {@id} UNSET ALLOWED_AUTHENTICATION_SECRETS
      comment: ALTER EXTERNAL ACCESS INTEGRATION {@id} UNSET COMMENT
- kind: ExternalFunction
  group: external.snowflake.hfl.dev
  version: v1alpha1
  plural: externalfunctions
  shape: sql
  read:
    method: POST
    path: /api/v2/statements
  writeOnly:
  - api_integration
  - arg
  - compression
  - context_headers
  - header
  - max_batch_rows
  - null_input_behavior
  - request_translator
  - response_translator
  - return_behavior
  - return_null_allowed
  - return_type
  - url_of_proxy_and_resource
  terraform:
  - snowflake_external_function
  sample:
    database: example_db
    schema: example_schema
    name: example_function
    arg:
    - name: payload
      type: VARCHAR
    return_type: VARIANT
    return_null_allowed: true
    return_behavior: IMMUTABLE
    api_integration: example_api_integration
    header:
    - name: x-example
      value: example-value
    context_headers:
    - CURRENT_ACCOUNT
    url_of_proxy_and_resource: https://example.execute-api.us-west-2.amazonaws.com/prod/example
    comment: example-comment
  readiness: fake
  sql:
    mode: object
    id: *id003
    fields:
      api_integration:
        type: identifier
      arg:
        type: args
      comment:
        type: string
      compression:
        type: keyword
        enum:
        - NONE
        - AUTO
        - GZIP
        - DEFLATE
      context_headers:
        type: keywords
      database:
        type: identifier
      header:
        type: objects
        item:
          template: "{name} = {value}"
          fields:
            name:
              type: string
            value:
              type: string
      max_batch_rows:
        type: integer
      name:
        type: identifier
      null_input_behavior:
        type: keyword
        enum:
        - CALLED ON NULL INPUT
        - RETURNS NULL ON NULL INPUT
        - STRICT
      request_translator:
        type: name
      response_translator:
        type: name
      return_behavior:
        type: keyword
        enum:
        - VOLATILE
        - IMMUTABLE
      return_null_allowed:
        type: boolean
      return_type:
        type: datatype
      schema:
        type: identifier
      url_of_proxy_and_resource:
        type: string
    create: CREATE EXTERNAL FUNCTION {@id}({arg}) RETURNS {return_type}[ NULL{?return_null_allowed}][ NOT NULL{!return_null_allowed}][ {null_input_behavior}] {return_behavior}[ COMMENT = {comment}] API_INTEGRATION = {api_integration}[ HEADERS = ({header})][ CONTEXT_HEADERS = ({context_headers})][ MAX_BATCH_ROWS = {max_batch_rows}][ COMPRESSION = {compression}][ REQUEST_TRANSLATOR = {request_translator}][ RESPONSE_TRANSLATOR = {response_translator}] AS {url_of_proxy_and_resource}
    delete: DROP FUNCTION IF EXISTS {@id}({arg.type})
    read:
    - statement: SHOW EXTERNAL FUNCTIONS LIKE {@like} IN SCHEMA {@parent}
      match:
        name: "{name}"
        catalog_name: "{database}"
        schema_name: "{schema}"
      columns:
        comment: description
    alter:
      comment: ALTER FUNCTION {@id}({arg.type}) SET COMMENT = {comment}
    unset:
      comment: ALTER FUNCTION {@id}({arg.type}) UNSET COMMENT
