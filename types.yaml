        type: objects
        item:
          template: "[CONSTRAINT {name} ]FOREIGN KEY ({columns}) REFERENCES {table_name} ({ref_columns})"
          fields:
            columns:
              type: identifiers
            name:
              type: identifier
            ref_columns:
              type: identifiers
            table_name:
              type: name
      index:
        type: objects
        item:
          template: INDEX {name} ({columns})[ INCLUDE ({include_columns})]
