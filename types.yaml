          fields:
            collate:
              type: string
            comment:
              type: string
            default:
              type: object
              item:
                template: "[{constant}][{expression}][{sequence}.NEXTVAL]"
                fields:
                  constant:
                    type: value
                  expression:
                    type: expression
                  sequence:
                    type: name
            name:
              type: identifier
            not_null:
              type: boolean
