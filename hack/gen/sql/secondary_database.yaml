kind: SecondaryDatabase
terraform: [snowflake_secondary_database]
scope: account
group: database
fields:
  as_replica_of: {type: name, required: true}
  data_retention_time_in_days: {type: integer}
  max_data_extension_time_in_days: {type: integer}
  comment: {type: string}
create: CREATE DATABASE {@id} AS REPLICA OF {as_replica_of}[ DATA_RETENTION_TIME_IN_DAYS = {data_retention_time_in_days}][ MAX_DATA_EXTENSION_TIME_IN_DAYS = {max_data_extension_time_in_days}][ COMMENT = {comment}]
read:
- statement: SHOW DATABASES LIKE {@like}
  match: {name: "{name}"}
  columns: {data_retention_time_in_days: retention_time, comment: comment}
alter:
  data_retention_time_in_days: ALTER DATABASE {@id} SET DATA_RETENTION_TIME_IN_DAYS = {data_retention_time_in_days}
  max_data_extension_time_in_days: ALTER DATABASE {@id} SET MAX_DATA_EXTENSION_TIME_IN_DAYS = {max_data_extension_time_in_days}
  comment: ALTER DATABASE {@id} SET COMMENT = {comment}
unset:
  data_retention_time_in_days: ALTER DATABASE {@id} UNSET DATA_RETENTION_TIME_IN_DAYS
  max_data_extension_time_in_days: ALTER DATABASE {@id} UNSET MAX_DATA_EXTENSION_TIME_IN_DAYS
  comment: ALTER DATABASE {@id} UNSET COMMENT
delete: DROP DATABASE IF EXISTS {@id}
sample:
  name: example_replica
  as_replica_of: example_org.example_account.example_db
  comment: example-comment
