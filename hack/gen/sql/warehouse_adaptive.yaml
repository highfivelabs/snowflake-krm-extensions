kind: WarehouseAdaptive
terraform: [snowflake_warehouse_adaptive]
scope: account
group: warehouse
fields:
  comment: {type: string}
  max_query_performance_level: {type: string, enum: [XSMALL, SMALL, MEDIUM, LARGE, XLARGE, XXLARGE, XXXLARGE]}
  query_throughput_multiplier: {type: integer}
  resource_monitor: {type: identifier}
  statement_queued_timeout_in_seconds: {type: integer}
  statement_timeout_in_seconds: {type: integer}
create: CREATE WAREHOUSE {@id} WAREHOUSE_TYPE = 'ADAPTIVE'[ COMMENT = {comment}][ MAX_QUERY_PERFORMANCE_LEVEL = {max_query_performance_level}][ QUERY_THROUGHPUT_MULTIPLIER = {query_throughput_multiplier}][ RESOURCE_MONITOR = {resource_monitor}][ STATEMENT_QUEUED_TIMEOUT_IN_SECONDS = {statement_queued_timeout_in_seconds}][ STATEMENT_TIMEOUT_IN_SECONDS = {statement_timeout_in_seconds}]
read:
- statement: SHOW WAREHOUSES LIKE {@like}
  match: {name: "{name}", type: ADAPTIVE}
  columns: {comment: comment, max_query_performance_level: max_query_performance_level, query_throughput_multiplier: query_throughput_multiplier, resource_monitor: resource_monitor}
alter:
  comment: ALTER WAREHOUSE {@id} SET COMMENT = {comment}
  max_query_performance_level: ALTER WAREHOUSE {@id} SET MAX_QUERY_PERFORMANCE_LEVEL = {max_query_performance_level}
  query_throughput_multiplier: ALTER WAREHOUSE {@id} SET QUERY_THROUGHPUT_MULTIPLIER = {query_throughput_multiplier}
  resource_monitor: ALTER WAREHOUSE {@id} SET RESOURCE_MONITOR = {resource_monitor}
  statement_queued_timeout_in_seconds: ALTER WAREHOUSE {@id} SET STATEMENT_QUEUED_TIMEOUT_IN_SECONDS = {statement_queued_timeout_in_seconds}
  statement_timeout_in_seconds: ALTER WAREHOUSE {@id} SET STATEMENT_TIMEOUT_IN_SECONDS = {statement_timeout_in_seconds}
unset:
  comment: ALTER WAREHOUSE {@id} UNSET COMMENT
  max_query_performance_level: ALTER WAREHOUSE {@id} UNSET MAX_QUERY_PERFORMANCE_LEVEL
  query_throughput_multiplier: ALTER WAREHOUSE {@id} UNSET QUERY_THROUGHPUT_MULTIPLIER
  resource_monitor: ALTER WAREHOUSE {@id} UNSET RESOURCE_MONITOR
  statement_queued_timeout_in_seconds: ALTER WAREHOUSE {@id} UNSET STATEMENT_QUEUED_TIMEOUT_IN_SECONDS
  statement_timeout_in_seconds: ALTER WAREHOUSE {@id} UNSET STATEMENT_TIMEOUT_IN_SECONDS
delete: DROP WAREHOUSE IF EXISTS {@id}
sample:
  name: example_adaptive_warehouse
  max_query_performance_level: MEDIUM
  comment: example-comment
