kind: AccountPasswordPolicyAttachment
terraform: [snowflake_account_password_policy_attachment]
mode: set
group: account
fields:
  password_policy: {type: name, required: true}
create: ALTER ACCOUNT SET PASSWORD POLICY {password_policy}
read:
- statement: SHOW PASSWORD POLICIES ON ACCOUNT
  columns: {password_policy: database_name.schema_name.name}
delete: ALTER ACCOUNT UNSET PASSWORD POLICY
sample:
  password_policy: example_db.example_schema.example_policy
