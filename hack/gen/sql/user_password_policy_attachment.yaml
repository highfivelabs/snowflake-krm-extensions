kind: UserPasswordPolicyAttachment
terraform: [snowflake_user_password_policy_attachment]
mode: set
group: user
fields:
  user_name: {type: identifier, required: true}
  password_policy_name: {type: name, required: true}
create: ALTER USER {user_name} SET PASSWORD POLICY {password_policy_name}
read:
- statement: SHOW PASSWORD POLICIES ON USER {user_name}
  columns: {password_policy_name: database_name.schema_name.name}
delete: ALTER USER {user_name} UNSET PASSWORD POLICY
sample:
  user_name: example_user
  password_policy_name: example_db.example_schema.example_policy
