kind: FailoverGroup
terraform: [snowflake_failover_group]
scope: account
fields:
  object_types: {type: keywords, required: true, enum: [ACCOUNT PARAMETERS, DATABASES, INTEGRATIONS, NETWORK POLICIES, RESOURCE MONITORS, ROLES, SHARES, USERS, WAREHOUSES]}
  allowed_databases: {type: identifiers}
  allowed_shares: {type: identifiers}
  allowed_integration_types: {type: keywords, enum: [SECURITY INTEGRATIONS, API INTEGRATIONS, STORAGE INTEGRATIONS, EXTERNAL ACCESS INTEGRATIONS, NOTIFICATION INTEGRATIONS]}
  allowed_accounts: {type: names, required: true}
  ignore_edition_check: {type: boolean}
  replication_schedule: {type: string}
  optimized_refresh: {type: boolean}
  rpo_assurance: {type: boolean}
create: CREATE FAILOVER GROUP {@id} OBJECT_TYPES = {object_types}[ ALLOWED_DATABASES = {allowed_databases}][ ALLOWED_SHARES = {allowed_shares}][ ALLOWED_INTEGRATION_TYPES = {allowed_integration_types}] ALLOWED_ACCOUNTS = {allowed_accounts}[ IGNORE EDITION CHECK{?ignore_edition_check}][ REPLICATION_SCHEDULE = {replication_schedule}][ OPTIMIZED_REFRESH = {optimized_refresh}]
read:
- statement: SHOW FAILOVER GROUPS
  match: {name: "{name}", is_primary: "true"}
  columns: {object_types: object_types, allowed_integration_types: allowed_integration_types, allowed_accounts: allowed_accounts, replication_schedule: replication_schedule}
  without: {allowed_accounts: organization_name.account_name}
- statement: SHOW DATABASES IN FAILOVER GROUP {@id}
  listColumns: {allowed_databases: name}
- statement: SHOW SHARES IN FAILOVER GROUP {@id}
  listColumns: {allowed_shares: name}
alter:
  object_types: ALTER FAILOVER GROUP {@id} SET OBJECT_TYPES = {object_types}
  allowed_integration_types: ALTER FAILOVER GROUP {@id} SET ALLOWED_INTEGRATION_TYPES = {allowed_integration_types}
  replication_schedule: ALTER FAILOVER GROUP {@id} SET REPLICATION_SCHEDULE = {replication_schedule}
  optimized_refresh: ALTER FAILOVER GROUP {@id} SET OPTIMIZED_REFRESH = {optimized_refresh}
  rpo_assurance: ALTER FAILOVER GROUP {@id} SET RPO_ASSURANCE = {rpo_assurance}
unset:
  replication_schedule: ALTER FAILOVER GROUP {@id} UNSET REPLICATION_SCHEDULE
  optimized_refresh: ALTER FAILOVER GROUP {@id} UNSET OPTIMIZED_REFRESH
  rpo_assurance: ALTER FAILOVER GROUP {@id} UNSET RPO_ASSURANCE
add:
  allowed_databases: ALTER FAILOVER GROUP {@id} ADD {allowed_databases} TO ALLOWED_DATABASES
  allowed_shares: ALTER FAILOVER GROUP {@id} ADD {allowed_shares} TO ALLOWED_SHARES
  allowed_accounts: ALTER FAILOVER GROUP {@id} ADD {allowed_accounts} TO ALLOWED_ACCOUNTS
remove:
  allowed_databases: ALTER FAILOVER GROUP {@id} REMOVE {allowed_databases} FROM ALLOWED_DATABASES
  allowed_shares: ALTER FAILOVER GROUP {@id} REMOVE {allowed_shares} FROM ALLOWED_SHARES
  allowed_accounts: ALTER FAILOVER GROUP {@id} REMOVE {allowed_accounts} FROM ALLOWED_ACCOUNTS
delete: DROP FAILOVER GROUP IF EXISTS {@id}
sample:
  name: example_failover_group
  object_types: [DATABASES, ROLES]
  allowed_databases: [example_db]
  allowed_accounts: [example_org.example_account]
  replication_schedule: 10 MINUTE
